<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHS Story Map</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <button class="icon-btn only-narrow" id="toggleSide" aria-label="Show side panel" title="Side panel">☰</button>
  <h1 class="brand">SHS Story Map</h1>
  <div class="bar-group">
    <label class="sr" for="epSelect">Episode</label>
    <select id="epSelect" title="Episode"><option value="">Choose an episode…</option></select>
    <label class="btn" title="Open a decoded episode JSON from your computer">
      Open JSON<input type="file" id="fileInput" accept=".json,application/json" hidden>
    </label>
  </div>
  <div class="bar-group" role="group" aria-label="View">
    <div class="seg" id="viewSeg">
      <button data-view="overview" aria-pressed="true">Scene map</button>
      <button data-view="scene" aria-pressed="false">Scene flow</button>
      <button data-view="all" aria-pressed="false">Everything</button>
    </div>
    <label class="sr" for="sceneSelect">Scene</label>
    <select id="sceneSelect" title="Scene"></select>
  </div>
  <div class="bar-group right">
    <label class="check" title="Show backgrounds, music, sound and other presentation cues">
      <input type="checkbox" id="cuesToggle"> Cues
    </label>
    <label class="sr" for="capSelect">Lines per node</label>
    <select id="capSelect" title="Lines shown per node">
      <option value="4">4 lines</option>
      <option value="8" selected>8 lines</option>
      <option value="16">16 lines</option>
      <option value="0">All lines</option>
    </select>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle light or dark theme" title="Theme">◐</button>
  </div>
</header>

<div class="main">
  <aside class="side" id="side">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="scenes">Scenes</button>
      <button role="tab" aria-selected="false" data-tab="vars">Variables</button>
      <button role="tab" aria-selected="false" data-tab="search">Search</button>
    </div>
    <div class="tabpanel" data-panel="scenes" id="scenesPanel"></div>
    <div class="tabpanel" data-panel="vars" id="varsPanel" hidden></div>
    <div class="tabpanel" data-panel="search" hidden>
      <input type="search" id="searchInput" placeholder="Find a line, speaker or segment" aria-label="Search lines">
      <div id="searchResults"></div>
    </div>
    <div class="epinfo" id="epInfo"></div>
  </aside>

  <section class="stage" id="stage" tabindex="0" aria-label="Story graph">
    <div class="world" id="world">
      <svg class="edges" id="edges" aria-hidden="true"><defs id="markers"></defs></svg>
    </div>
    <div class="empty" id="empty">
      <h2>Drop a decoded episode here</h2>
      <p>Drag an episode <code>.json</code> from <code>shs_decoder.py</code> onto this page, use <em>Open JSON</em>, or list your episodes in <code>episodes/index.json</code> so they appear in the picker.</p>
      <p class="err" id="loadErr" role="alert"></p>
    </div>
    <div class="legend collapsed" id="legend">
      <button class="legend-toggle" id="legendToggle" aria-expanded="false">Key</button>
      <ul id="legendList"></ul>
      <p class="hint">Drag or scroll to pan. Ctrl + scroll or pinch to zoom. Press 0 to fit.</p>
    </div>
    <div class="zoom">
      <button class="icon-btn" id="zoomOut" aria-label="Zoom out">−</button>
      <button class="icon-btn" id="zoomFit" aria-label="Fit to screen">⤢</button>
      <button class="icon-btn" id="zoomIn" aria-label="Zoom in">+</button>
    </div>
    <div class="dropveil" id="dropveil">Drop to open</div>
  </section>

  <aside class="inspector" id="inspector" hidden>
    <div class="insp-head">
      <h2 id="inspTitle"></h2>
      <button class="icon-btn" id="inspClose" aria-label="Close details">×</button>
    </div>
    <div class="insp-body" id="inspBody"></div>
  </aside>
</div>

<script src="vendor/dagre.min.js"></script>
<script src="app.js"></script>
</body>
</html>
